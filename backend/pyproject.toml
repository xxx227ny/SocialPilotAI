[project]
name = "socialpilot-api"
version = "0.1.0"
description = "SocialPilot AI backend API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "cryptography>=45.0,<46.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = [
    "smoke: tests that call external services",
    "qwen_smoke: tests that make real Qwen API requests",
    "wanx_smoke: tests that make real Wanx API requests",
    "happyhorse_smoke: tests that make real HappyHorse API requests",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
