server {
    listen 443 ssl http2;
    server_name staging.47.242.222.177.nip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/socialpilot-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialpilot-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:socialpilot_staging_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 120s;

    access_log /var/log/nginx/socialpilot-staging-access.log socialpilot_timed;
    error_log /var/log/nginx/socialpilot-staging-error.log warn;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_redirect off;
    proxy_buffering off;

    location = /api/v1/auth/login {
        limit_req zone=socialpilot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /api/v1/auth/register {
        limit_req zone=socialpilot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /api/v1/credentials/dashscope/verify {
        limit_req zone=socialpilot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    location ^~ /api/ {
        limit_req zone=socialpilot_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    location ~ (^|/)\. { return 404; }

    location ^~ /assets/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css text/javascript application/javascript;
        proxy_buffering on;
        proxy_pass http://127.0.0.1:8081;
    }

    location / { proxy_pass http://127.0.0.1:8081; }
}
